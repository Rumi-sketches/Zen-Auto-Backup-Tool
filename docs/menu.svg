<svg xmlns="http://www.w3.org/2000/svg" width="740" height="392" viewBox="0 0 740 392" role="img" aria-label="The Zen Backup Tool main menu running in a Windows terminal">
  <rect x="0" y="0" width="740" height="392" rx="10" fill="#0c0c0c"/>
  <rect x="0" y="0" width="740" height="34" rx="10" fill="#1f1f1f"/>
  <rect x="0" y="24" width="740" height="10" fill="#1f1f1f"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="17" r="6" fill="#febc2e"/>
  <circle cx="62" cy="17" r="6" fill="#28c840"/>
  <text xml:space="preserve" x="90" y="22" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a">ZenBackup.bat</text>

  <g font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14">    <text xml:space="preserve" x="20" y="62"  fill="#3ae0e0">======= Zen Backup Tool v1.0.0  -  by @Rumi-sketches =======</text>
    <text xml:space="preserve" x="20" y="82"  fill="#cccccc"> Profile : 8ca1ftdb.Default (release)</text>
    <text xml:space="preserve" x="20" y="102" fill="#cccccc"> Backups : C:\Users\You\ZenBackups</text>
    <text xml:space="preserve" x="20" y="122" fill="#cccccc"> Auto    : daily at 13:00   keep 10   [appearance,shortcuts,spaces,preferences]</text>
    <text xml:space="preserve" x="20" y="142" fill="#3ae0e0">============================================================</text>

    <text xml:space="preserve" x="20" y="182" fill="#cccccc"> 1) Backup now</text>
    <text xml:space="preserve" x="20" y="202" fill="#cccccc"> 2) Restore from a backup</text>
    <text xml:space="preserve" x="20" y="222" fill="#cccccc"> 3) Automatic backup settings</text>
    <text xml:space="preserve" x="20" y="242" fill="#cccccc"> 4) Reset Zen to factory settings</text>
    <text xml:space="preserve" x="20" y="262" fill="#cccccc"> 5) Open backups folder</text>
    <text xml:space="preserve" x="20" y="282" fill="#cccccc"> 0) Quit</text>

    <text xml:space="preserve" x="20" y="322" fill="#cccccc">Choice:</text>
    <rect x="82" y="309" width="9" height="17" fill="#cccccc"/>

    <text xml:space="preserve" x="20" y="362" fill="#5a5a5a">(!) passwords and cookies are off by default - see Security in the README</text>
  </g>
</svg>

